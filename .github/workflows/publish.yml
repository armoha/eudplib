# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.abi-tag }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── cp310-abi3 wheels (GIL-enabled, Python 3.10+) ──
          - os: ubuntu-latest
            abi-feature: "pyo3/abi3-py310"
            abi-tag: "cp310-abi3"
            auditwheel: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm
            abi-feature: "pyo3/abi3-py310"
            abi-tag: "cp310-abi3"
            auditwheel: manylinux_2_17_aarch64
          - os: macos-13
            abi-feature: "pyo3/abi3-py310"
            abi-tag: "cp310-abi3"
            macos-arch: x86_64
            macos-deployment-target: "10.9"
          - os: macos-latest
            abi-feature: "pyo3/abi3-py310"
            abi-tag: "cp310-abi3"
          - os: windows-latest
            abi-feature: "pyo3/abi3-py310"
            abi-tag: "cp310-abi3"

          # ── cp311-abi3 wheels (GIL-enabled, Python 3.11+, newer APIs) ──
          - os: ubuntu-latest
            abi-feature: "pyo3/abi3-py311"
            abi-tag: "cp311-abi3"
            auditwheel: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm
            abi-feature: "pyo3/abi3-py311"
            abi-tag: "cp311-abi3"
            auditwheel: manylinux_2_17_aarch64
          - os: macos-13
            abi-feature: "pyo3/abi3-py311"
            abi-tag: "cp311-abi3"
            macos-arch: x86_64
            macos-deployment-target: "10.9"
          - os: macos-latest
            abi-feature: "pyo3/abi3-py311"
            abi-tag: "cp311-abi3"
          - os: windows-latest
            abi-feature: "pyo3/abi3-py311"
            abi-tag: "cp311-abi3"

          # ── cp314t wheels (free-threaded Python 3.14) ──
          - os: ubuntu-latest
            abi-feature: "none"
            abi-tag: "cp314t"
            auditwheel: manylinux_2_17_x86_64
            python-version: "3.14t"
          - os: macos-latest
            abi-feature: "none"
            abi-tag: "cp314t"
            python-version: "3.14t"
          - os: windows-latest
            abi-feature: "none"
            abi-tag: "cp314t"
            python-version: "3.14t"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version || '3.x' }}
        allow-prereleases: true
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build auditwheel
    - name: Set macOS environment
      if: runner.os == 'macOS' && matrix.macos-arch
      run: |
        echo "_PYTHON_HOST_PLATFORM=macosx-${{ matrix.macos-deployment-target }}-${{ matrix.macos-arch }}" >> $GITHUB_ENV
        echo "ARCHFLAGS=-arch ${{ matrix.macos-arch }}" >> $GITHUB_ENV
    - name: Set abi3 feature
      if: matrix.abi-feature != 'pyo3/abi3-py310'
      env:
        ABI_FEATURE: ${{ matrix.abi-feature }}
      run: |
        python -c "
        import pathlib, os
        p = pathlib.Path('pyproject.toml')
        content = p.read_text()
        abi = os.environ['ABI_FEATURE']
        if abi == 'none':
            content = content.replace('features = [\"pyo3/abi3-py310\"]', 'features = []')
        else:
            content = content.replace('pyo3/abi3-py310', abi)
        p.write_text(content)
        "
    - name: Build wheel
      run: python -m build --wheel
    - name: Repair wheel (Linux)
      if: runner.os == 'Linux' && matrix.auditwheel
      run: |
        auditwheel repair --plat ${{ matrix.auditwheel }} dist/*.whl -w dist/
        rm dist/*-linux_*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.abi-tag }}
        path: dist/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build sdist
      run: python -m build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
