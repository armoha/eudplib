name: Ruff
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: chartboost/ruff-action@v1
        with:
          version: "0.9.0"
          src: "./src/eudplib"
