name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unittest (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.13t"
            experimental: true
          - python-version: "3.14t"
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit test
        run: |
          pip install .
          cd tests
          python test_unittest.py
          cd ..

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpython for embedding tests
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Format check
        working-directory: src/rust
        run: cargo fmt -p eudplib-epscript -- --check
      - name: Clippy
        working-directory: src/rust
        run: cargo clippy -p eudplib-epscript --all-targets
      - name: Test
        working-directory: src/rust
        run: cargo test -p eudplib-epscript
      - name: MSRV check
        working-directory: src/rust
        run: |
          rustup toolchain install 1.83.0 --profile minimal
          cargo +1.83.0 check -p eudplib-epscript

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install --upgrade mypy typing_extensions
      - name: Run mypy for Python 3.10 (min)
        run: mypy src/eudplib --python-version 3.10
      - name: Run mypy for Python 3.14 (max)
        run: mypy src/eudplib --python-version 3.14

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1
        with:
          config: ./.typos.toml

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./src/eudplib"
