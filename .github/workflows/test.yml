name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Unittest
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit test
        run: |
          pip install .
          cd tests
          python test_unittest.py
          cd ..

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpython for embedding tests
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Format check
        working-directory: src/rust
        run: cargo fmt -p eudplib-epscript -- --check
      - name: Clippy
        working-directory: src/rust
        run: cargo clippy -p eudplib-epscript --all-targets
      - name: Test
        working-directory: src/rust
        run: cargo test -p eudplib-epscript
      - name: MSRV check
        working-directory: src/rust
        run: |
          rustup toolchain install 1.65.0 --profile minimal
          cargo +1.65.0 check -p eudplib-epscript

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install "mypy==1.14.1" typing_extensions
      - name: Run mypy for Python 3.11
        run: mypy src/eudplib --python-version 3.11
      - name: Run mypy for Python 3.10
        run: mypy src/eudplib --python-version 3.10

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1
        with:
          config: ./.typos.toml
